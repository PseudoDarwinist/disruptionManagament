# Unique name for this workflow
name: Create scratch org and deploy on irr/develop

# Run on merges/pushes to irr/develop (same convention as SIT)
on:
  push:
    branches: [irr/develop]
    paths:
      - "sas-core/**"
      - "scripts/create-org.sh"
      - ".forceignore"
  workflow_dispatch: {}

jobs:
  deploy-to-scratch:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install SFDX Data Move Utility (sfdmu)
        run: echo y | sf plugins:install sfdmu

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Dev Hub (SFDX URL preferred; fallback to JWT)
        run: |
          if [ -n "${{ secrets.SFDX_AUTH_URL }}" ]; then
            echo "Using SFDX Auth URL secret for Dev Hub auth"
            echo "${{ secrets.SFDX_AUTH_URL }}" > ./sfdx-auth-url.txt
            sf org login sfdx-url --sfdx-url-file ./sfdx-auth-url.txt --alias DevHub
          else
            echo "SFDX_AUTH_URL not set; falling back to JWT auth"
            echo "${{ secrets.CI_KEY }}" > ./SF_JWT_KEY.key
            sf org login jwt \
              --username "${{ secrets.DEVHUB_USERNAME }}" \
              --jwt-key-file ./SF_JWT_KEY.key \
              --client-id "${{ secrets.DEVHUB_CLIENT_ID }}" \
              --alias DevHub
          fi
          sf config set target-dev-hub DevHub --global

      - name: Create scratch org and prepare with project script
        run: |
          chmod +x scripts/create-org.sh
          ./scripts/create-org.sh

      # Optional: Second deploy is redundant because the script already deploys.
      # Uncomment this block only if you want a safety net redeploy.
      # - name: Deploy project to the created scratch org
      #   run: |
      #     sf project deploy start \
      #       --target-org MyIRR \
      #       --ignore-conflicts \
      #       --concise

      - name: Install jq (for parsing JSON)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Summarize scratch org details (no secrets)
        run: |
          USERNAME=$(sf org display --target-org MyIRR --json | jq -r '.result.username')
          INSTANCE=$(sf org display --target-org MyIRR --json | jq -r '.result.instanceUrl')
          {
            echo "Scratch org alias: MyIRR"
            echo "Username: ${USERNAME}"
            echo "Instance URL: ${INSTANCE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export scratch org SFDX auth URL (sensitive) and upload as artifact
        run: |
          sf org display --target-org MyIRR --verbose --json | jq -r '.result.sfdxAuthUrl' > myirr_sfdx_auth_url.txt
        
      - name: Upload auth URL artifact (expires in 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: myirr-sfdx-auth-url
          path: myirr_sfdx_auth_url.txt
          retention-days: 1

